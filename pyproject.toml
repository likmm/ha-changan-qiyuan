[project]
name = "ha-changan-qiyuan"
version = "0.1.3"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.11,<3.14"]
[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "aioresponses", "ruff"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E9", "F"]

[tool.setuptools.packages.find]
include = ["custom_components*"]
