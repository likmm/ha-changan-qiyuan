name: Validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e '.[test]'
      - run: ruff check .
      - run: pytest -q
      - run: python -m compileall -q custom_components
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish initial version if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.3; then
            gh release create v0.1.3 --target "$GITHUB_SHA" --title "v0.1.3" --notes "定位超过 30 分钟保留最后有效位置，显示原始定位时间及过期标志。默认轮询保持 10 分钟。"
          fi
