name: Validate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e '.[test]'
      - run: ruff check .
      - run: pytest -q
      - run: python -m compileall -q custom_components
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish initial version if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.1; then
            gh release create v0.1.1 --target "$GITHUB_SHA" --title "v0.1.1" --notes "新增 GPS 纬度、GPS 经度传感器（WGS84），与地图共用校验及转换，定位无效或过期时不可用。"
          fi
