name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e '.[test]'
      - run: ruff check . && pytest -q
      - name: Publish v0.1.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.2 --target "$GITHUB_SHA" --title "v0.1.2" --notes "新增 GPS 纬度、GPS 经度传感器（WGS84），与地图共用校验及转换，定位无效或过期时不可用。"
