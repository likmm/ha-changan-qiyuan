name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e '.[test]'
      - run: ruff check . && pytest -q
      - name: Publish v0.1.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.3 --target "$GITHUB_SHA" --title "v0.1.3" --notes "定位超过 30 分钟保留最后有效位置，显示原始定位时间及过期标志。默认轮询保持 10 分钟。"
