name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e '.[test]'
      - run: ruff check . && pytest -q
      - name: Publish v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 --target "$GITHUB_SHA" --title "v0.1.0" --notes "首个只读版本。支持手动 Token、车况传感器及可选 GPS。尚待真实 HA OS 安装与实车验收。"
